name: Private job watcher

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    # GitHub cache contents in a public repository are accessible to readers.
    # Refuse to run until this repo is private so listing state stays private.
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: data/
          key: career-watcher-${{ github.run_id }}
          restore-keys: career-watcher-
      - name: Prepare private config
        env:
          WATCH_CONFIG_JSON_BASE64: ${{ secrets.WATCH_CONFIG_JSON_BASE64 }}
        run: |
          test -n "$WATCH_CONFIG_JSON_BASE64"
          python -c 'import base64,os,pathlib; pathlib.Path("config/companies.json").write_bytes(base64.b64decode(os.environ["WATCH_CONFIG_JSON_BASE64"]))'
      - name: Watch listings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m jobwatcher.app run --config config/companies.json --db data/career-watcher.sqlite3
      - uses: actions/cache/save@v4
        if: always() && github.event.repository.private == true
        with:
          path: data/
          key: career-watcher-${{ github.run_id }}
